<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>효종의 포터 드라이브 🚛</title>
    <meta name="description" content="효종이 포터 트럭을 운전하며 짐을 배달하는 짜릿한 레이싱 게임!">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>
        
        <!-- Start Screen -->
        <div id="start-screen" class="overlay">
            <div class="start-content">
                <div class="title-badge">전국 총알배송 🚀</div>
                <div class="title-glow">
                    <h1>효종의<br><span>포터 드라이브</span></h1>
                </div>
                <div class="truck-avatar-container">
                    <div class="truck-emoji">🚛</div>
                    <div class="hyojong-badge">👨‍✈️ 효종 기사님</div>
                </div>
                <p class="subtitle">택배 짐을 가득 싣고 고속도로를 질주하세요!<br>장애물을 피하고 📦 상자를 모아 최고 기록을 세우세요!</p>
                <div class="controls-info">
                    <div class="key-group">
                        <div class="keys-row">
                            <span class="key">←</span><span class="key">→</span>
                        </div>
                        <span class="key-label">좌우 차선 이동</span>
                    </div>
                    <div class="key-group">
                        <div class="keys-row">
                            <span class="key">↑</span><span class="key">↓</span>
                        </div>
                        <span class="key-label">가속 / 브레이크</span>
                    </div>
                </div>
                <button id="start-btn" class="game-btn pulse">🚛 배달 출발! (Enter) 🚛</button>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud" class="hidden">
            <div class="hud-top-left">
                <div class="hud-chip score-chip">
                    <span class="hud-icon">📦</span>
                    <div class="chip-text">
                        <span class="chip-label">배달 점수</span>
                        <span id="score" class="chip-value">0</span>
                    </div>
                </div>
                <div id="combo-container" class="hud-chip combo-chip hidden">
                    <span class="hud-icon">🔥</span>
                    <span id="combo" class="chip-value">x1</span>
                    <span class="combo-label">COMBO!</span>
                </div>
            </div>

            <div class="hud-top-center">
                <div class="speedometer-box">
                    <div class="speed-value-row">
                        <span id="speed">0</span>
                        <span class="speed-unit">km/h</span>
                    </div>
                    <div class="speed-bar-bg">
                        <div id="speed-bar" class="speed-bar-fill"></div>
                    </div>
                </div>
            </div>

            <div class="hud-top-right">
                <div class="hud-chip distance-chip">
                    <span class="hud-icon">🛣️</span>
                    <div class="chip-text">
                        <span class="chip-label">주행 거리</span>
                        <div><span id="distance" class="chip-value">0</span><span class="dist-unit">m</span></div>
                    </div>
                </div>
                <div class="hud-chip lives-chip">
                    <span id="lives">❤️❤️❤️</span>
                </div>
                <button id="sound-btn" class="icon-btn" title="소리 켜기/끄기">🔊</button>
            </div>
        </div>

        <!-- Mobile Touch Controls -->
        <div id="touch-controls" class="hidden">
            <div class="touch-left-zone">
                <button id="touch-left" class="touch-btn">◀</button>
                <button id="touch-right" class="touch-btn">▶</button>
            </div>
            <div class="touch-right-zone">
                <button id="touch-brake" class="touch-btn pedal-btn brake-pedal">브레이크</button>
                <button id="touch-gas" class="touch-btn pedal-btn gas-pedal">엑셀 🚀</button>
            </div>
        </div>

        <!-- Game Over Screen -->
        <div id="gameover-screen" class="overlay hidden">
            <div class="gameover-content">
                <div class="gameover-badge">배달 종료</div>
                <h2>💥 사고 발생!</h2>
                <p class="gameover-desc">트럭이 파손되어 정비소로 입고되었습니다.</p>
                <div class="final-stats">
                    <div class="stat-row">
                        <span class="stat-label">📦 최종 배달 점수</span>
                        <span id="final-score" class="stat-value">0</span>
                    </div>
                    <div class="stat-row">
                        <span class="stat-label">🛣️ 주행 거리</span>
                        <span id="final-distance" class="stat-value">0m</span>
                    </div>
                    <div class="stat-row highlight">
                        <span class="stat-label">🏆 역대 최고 기록</span>
                        <span id="high-score" class="stat-value">0</span>
                    </div>
                </div>
                <button id="restart-btn" class="game-btn pulse">🔄 포터 수리 완료! 다시 출발 (Enter)</button>
            </div>
        </div>

        <!-- Float Notification -->
        <div id="notification" class="hidden"></div>
    </div>

    <script src="game.js"></script>
</body>
</html>
