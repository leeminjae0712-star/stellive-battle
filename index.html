<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>스텔라이브 배틀: 나나 vs 시부키 - hanakonana.cloud</title>
  <link rel="stylesheet" href="css/style.css">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;600;700;800;900&family=Outfit:wght@600;700;800;900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app" class="app-container">
    <!-- Header -->
    <header class="game-header">
      <div class="logo-area">
        <span class="badge-tag">Reels 1v1 Battle</span>
        <h1 class="logo-title"><span class="highlight">스텔라이브</span> 배틀</h1>
        <span class="sub-domain">hanakonana.cloud</span>
      </div>

      <div class="header-controls">
        <button id="btn-sound" class="icon-btn" title="사운드 온/오프">
          <i data-lucide="volume-2"></i>
        </button>
        <button id="btn-fullscreen" class="icon-btn" title="전체화면">
          <i data-lucide="maximize"></i>
        </button>
      </div>
    </header>

    <!-- Top 50:50 Split VS Cooldown & Health HUD -->
    <section class="vs-hud-container" id="vs-hud">
      <!-- Left: Hanako Nana -->
      <div class="vs-fighter-card nana-card" id="vs-card-nana">
        <div class="vs-profile-row">
          <div class="vs-avatar-box">
            <img src="assets/nana_avatar.png" alt="하나코 나나">
          </div>
          <div class="vs-name-box">
            <span class="vs-fighter-name">하나코 나나</span>
            <span class="vs-hp-text" id="hud-hp-nana">3000 / 3000 HP</span>
          </div>
        </div>

        <!-- HP Bar & Hearts -->
        <div class="vs-bar-wrap">
          <div class="vs-bar-bg">
            <div class="vs-bar-fill hp-fill" id="hud-hp-bar-nana" style="width: 100%;"></div>
          </div>
          <div class="vs-hearts-row" id="hud-hearts-nana">❤️❤️❤️❤️❤️</div>
        </div>

        <!-- Skill 1 & Ult Cooldown Bars -->
        <div class="vs-cooldowns-grid">
          <div class="cd-row">
            <div class="cd-label-row">
              <span class="cd-name">🌸 사랑이 사격</span>
              <span class="cd-status" id="hud-s1-status-nana">READY!</span>
            </div>
            <div class="cd-bar-bg">
              <div class="cd-bar-fill s1-fill" id="hud-s1-bar-nana" style="width: 100%;"></div>
            </div>
          </div>

          <div class="cd-row">
            <div class="cd-label-row">
              <span class="cd-name">⚡ 사랑이 난사</span>
              <span class="cd-status" id="hud-ult-status-nana">0%</span>
            </div>
            <div class="cd-bar-bg">
              <div class="cd-bar-fill ult-fill" id="hud-ult-bar-nana" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- VS Center Badge -->
      <div class="vs-divider">
        <div class="vs-badge">VS</div>
      </div>

      <!-- Right: Tenko Shibuki -->
      <div class="vs-fighter-card shibuki-card" id="vs-card-shibuki">
        <div class="vs-profile-row reverse">
          <div class="vs-avatar-box">
            <img src="assets/shibuki_avatar.png" alt="텐코 시부키">
          </div>
          <div class="vs-name-box right-align">
            <span class="vs-fighter-name">텐코 시부키</span>
            <span class="vs-hp-text" id="hud-hp-shibuki">3300 / 3300 HP</span>
          </div>
        </div>

        <!-- HP Bar & Hearts -->
        <div class="vs-bar-wrap">
          <div class="vs-bar-bg">
            <div class="vs-bar-fill hp-fill shibuki-hp" id="hud-hp-bar-shibuki" style="width: 100%;"></div>
          </div>
          <div class="vs-hearts-row right-align" id="hud-hearts-shibuki">❤️❤️❤️❤️❤️</div>
        </div>

        <!-- Skill 1 & Ult Cooldown Bars -->
        <div class="vs-cooldowns-grid">
          <div class="cd-row">
            <div class="cd-label-row">
              <span class="cd-name">🦊 뿔 발사</span>
              <span class="cd-status" id="hud-s1-status-shibuki">READY!</span>
            </div>
            <div class="cd-bar-bg">
              <div class="cd-bar-fill s1-fill shibuki-s1" id="hud-s1-bar-shibuki" style="width: 100%;"></div>
            </div>
          </div>

          <div class="cd-row">
            <div class="cd-label-row">
              <span class="cd-name">🌟 캥캥이</span>
              <span class="cd-status" id="hud-ult-status-shibuki">0%</span>
            </div>
            <div class="cd-bar-bg">
              <div class="cd-bar-fill ult-fill" id="hud-ult-bar-shibuki" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- Main Workspace (Centered Giant Arena) -->
    <main class="main-layout-reels">
      <!-- Center: Giant 820px Arena & Controls -->
      <section class="arena-section">
        <div class="canvas-wrapper" id="canvas-wrapper">
          <canvas id="battle-canvas"></canvas>

          <!-- Ultimate Skill Cut-in Banner Overlay (Non-blocking) -->
          <div id="ult-cutin-overlay" class="cutin-overlay hidden">
            <div class="cutin-banner">
              <div class="cutin-character-art">
                <img id="cutin-img" src="" alt="Fighter">
              </div>
              <div class="cutin-text-group">
                <span class="cutin-sub" id="cutin-fighter-name">하나코 나나</span>
                <h2 class="cutin-title" id="cutin-skill-name">사랑이 난사!</h2>
                <p class="cutin-desc" id="cutin-skill-desc">기관총처럼 16연발 탄환을 [뚜루루룰루~] 쏟아붓습니다!</p>
              </div>
            </div>
          </div>

          <!-- Clean Winner Announcement with Profile Avatar -->
          <div id="winner-overlay" class="winner-overlay hidden">
            <div class="winner-card">
              <div class="winner-avatar-wrap">
                <img id="winner-img" class="winner-avatar-img" src="assets/shibuki_avatar.png" alt="Winner Profile">
              </div>
              <h2 id="winner-name" class="winner-name">텐코 시부키 승리!</h2>
              <div class="winner-actions">
                <button id="btn-rematch" class="btn btn-primary btn-lg">
                  <i data-lucide="rotate-ccw"></i> 다시 시작
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Arena Control Bar -->
        <div class="control-panel">
          <div class="control-group">
            <button id="btn-start" class="btn btn-success btn-icon-text">
              <i data-lucide="play"></i> <span id="btn-start-text">배틀 시작</span>
            </button>
            <button id="btn-reset" class="btn btn-secondary btn-icon-text">
              <i data-lucide="rotate-ccw"></i> 리셋
            </button>
          </div>

          <!-- Speed Multipliers -->
          <div class="control-group speed-group">
            <span class="control-label"><i data-lucide="gauge"></i> 속도:</span>
            <div class="btn-group">
              <button class="speed-btn" data-speed="0.5">0.5x</button>
              <button class="speed-btn active" data-speed="1">1x</button>
              <button class="speed-btn" data-speed="1.5">1.5x</button>
              <button class="speed-btn" data-speed="2">2x</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <!-- Scripts -->
  <script src="js/data/characters.js"></script>
  <script src="js/engine/audio.js"></script>
  <script src="js/engine/arena.js"></script>
  <script src="js/engine/physics.js"></script>
  <script src="js/entities/particle.js"></script>
  <script src="js/entities/skill.js"></script>
  <script src="js/entities/fighter.js"></script>
  <script src="js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.lucide) {
        lucide.createIcons();
      }
    });
  </script>
</body>
</html>
